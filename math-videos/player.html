<style>

<body>
<div id="frame">
  <header><div class="tag" id="tag"></div><div class="chapters" id="chapters"></div></header>
  <div id="stage"></div>
  <div id="caption"></div>
  <div id="bar"><div id="fill"></div></div>
</div>
<script>
const MOVES = [['Divide', 'first term ÷ first term'], ['Multiply', 'answer × divisor'], ['Subtract', 'change signs, then add'], ['Bring down', 'the next term']]
const MNEMONIC = ['Dad', 'Mom', 'Sister', 'Brother']
const SYN_STEPS = ['Bring down', 'Multiply', 'Add']
let D, total, cur = -1, items = [], hls = [], flips = [], versions = [], draws = [], sentences = [], timer = null, chapterEls = []
const $ = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e }
const tex = (s, display = false) => katex.renderToString((display ? '\\displaystyle ' : '') + s, { throwOnError: false })
const clamp = x => Math.max(0, Math.min(1, x))
const ease = x => 1 - Math.pow(1 - x, 3)

window.setup = data => {
  D = data
  total = D.scenes.reduce((a, s) => a + s.dur, 0)
  document.getElementById('tag').textContent = D.tag
  const ch = document.getElementById('chapters')
  chapterEls = D.chapters.map(c => { const e = $('span', '', c); ch.appendChild(e); return e })
  // cumulative reveals per layout: which keys were revealed before each scene
  const seen = {}
  D.scenes.forEach(s => {
    const v = s.view
    if (!['longdiv', 'synth', 'graph', 'conic', 'plane'].includes(v.kind)) return
    seen[v.layout] ??= new Set()
    s.prevKeys = [...seen[v.layout]]
    ;(v.reveal ?? []).forEach(([k]) => seen[v.layout].add(k))
  })
  return total
}

function mark(s, m) { return m == null || m === 0 ? 0 : m < 0 ? m : s.marks[m] ?? 0 }
function reveal(el, at, opts = {}) { el.classList.add('reveal'); items.push({ el, at, ...opts }); return el }

function build(s) {
  const outer = document.getElementById('stage')
  outer.innerHTML = ''
  const stage = $('div', 'fit')
  outer.append(stage)
  items = []; hls = []; flips = []; versions = []; draws = []; timer = null
  const v = s.view
  if (v.kind === 'title') {
    const w = $('div', 'title')
    w.append($('div', 'kicker', v.kicker), $('h1', '', `${v.title}<em>${v.em}</em>`), $('div', 'sub', v.sub))
    reveal(w, 0)
    stage.append(w)
  } else if (v.kind === 'lines') {
    const w = $('div', 'lines')
    if (v.title) w.append(reveal($('h2', '', v.title), 0))
    for (const l of v.lines) {
      const row = $('div', `line${l.big ? ' big' : ''}${l.box ? ' box' : ''}${l.glow ? ' glow' : ''}`)
      if (l.parts) l.parts.forEach(p => row.append(reveal($('span', '', p.text ? inl(p.text) : tex(p.tex, true)), mark(s, p.at))))
      else if (l.text) { row.innerHTML = inl(l.text); reveal(row, mark(s, l.at)) }
      else { row.innerHTML = tex(l.tex, true); reveal(row, mark(s, l.at)) }
      w.append(row)
    }
    stage.append(w)
  } else if (v.kind === 'moves') {
    const w = $('div', 'moves'), cards = $('div', 'cards')
    MOVES.forEach(([name, d], i) => {
      const c = $('div', 'card')
      c.append($('div', 'n', i + 1), $('div', 'name', name), $('div', 'd', d))
      if (v.mnemonicAt) c.append(reveal($('div', 'mn', MNEMONIC[i]), mark(s, v.mnemonicAt) + i * 0.32))
      cards.append(v.at ? reveal(c, mark(s, v.at[i])) : c)
    })
    w.append(cards)
    if (v.repeatAt) w.append(reveal($('div', 'repeat', '↻  REPEAT UNTIL YOU CAN’T DIVIDE'), mark(s, v.repeatAt)))
    stage.append(w)
  } else if (v.kind === 'longdiv' || v.kind === 'synth') {
    const L = D.layouts[v.layout]
    const wrap = $('div', 'ld-wrap'), main = $('div', 'ld-main')
    main.append($('div', 'problem', tex(L.problem)))

    const card = $('div', 'card wide model-card')
    card.append(it.type === 'foil' ? $('div', '', FOIL) : modelSvg(it.type))
    if (it.label) card.append($('div', 'name', inl(it.label)))
    if (it.sub) card.append($('div', 'd', inl(it.sub)))
    row.append(reveal(card, mark(s, it.at)))
  }
  return wrapWithSide(s, v, row)
}

// ---------- history views ----------
// histmap: one step of the history site's map. Territories fade in at landsAt, routes draw at routesAt[i], cities at citiesAt.
function histMap(s, v) {
  const L = D.layouts[v.layout], st = L.steps[v.step], B = L.bases[st.base]
  const [vx, vy, vw, vh] = v.vb ?? st.vb, k = vw / 1000
  const W = v.side?.length || s.countdown ? 800 : 980, H = Math.round(W * vh / vw)
  const svg = svgEl('svg', { viewBox: `${vx} ${vy} ${vw} ${vh}`, width: W, height: H })
  const defs = svgEl('defs', {}, svg), clip = svgEl('clipPath', { id: 'hland' }, defs)
  svgEl('path', { d: B.land }, clip)
  svgEl('rect', { x: -B.w, y: -B.h, width: B.w * 3, height: B.h * 3, fill: '#CFE0E6' }, svg)
  svgEl('path', { d: B.land, fill: '#F3ECDD' }, svg)
  svgEl('path', { d: B.lakes, fill: '#CFE0E6' }, svg)
  for (const r of B.rivers) svgEl('path', { d: r, fill: 'none', stroke: '#8FB2C6', 'stroke-width': 1.4 * k }, svg)
  const g = svgEl('g', { 'clip-path': 'url(#hland)' }, svg)
  st.lands.forEach(l => { const lg = svgEl('g', {}, g); svgEl('path', { d: l.d, fill: l.color, opacity: l.faint ? 0.18 : 0.5 }, lg); reveal(lg, mark(s, v.landsAt ?? 0), { noMove: true }) })
  svgEl('path', { d: B.land, fill: 'none', stroke: '#9DB2B9', 'stroke-width': 0.8 * k }, svg)
  st.routes.forEach((r, i) => {
    const at = mark(s, (v.routesAt ?? [])[i] ?? v.routesAt?.[0] ?? 0)
    if (r.arrow) { const m = svgEl('marker', { id: `hah${i}`, viewBox: '0 0 10 10', refX: 7, refY: 5, markerWidth: 5, markerHeight: 5, orient: 'auto' }, defs); svgEl('path', { d: 'M0,0 L10,5 L0,10 z', fill: r.color }, m) }
    const p = svgEl('path', { d: r.d, fill: 'none', stroke: r.color, 'stroke-width': (r.label ? 3.4 : 2.2) * k, 'stroke-linecap': 'round', 'stroke-linejoin': 'round', ...(r.arrow ? { 'marker-end': `url(#hah${i})` } : {}), ...(r.dashed ? { 'stroke-dasharray': `${9 * k} ${7 * k}` } : { pathLength: 1000 }) }, svg)
    if (r.dashed) reveal(p, at, { noMove: true }); else draws.push({ el: p, at })
    if (r.label) { const tx = svgEl('text', { x: r.at[0], y: r.at[1] - 8 * k, 'text-anchor': 'middle', 'font-size': 19 * k, 'font-weight': 800, fill: r.color, 'paint-order': 'stroke', stroke: '#ffffffcc', 'stroke-width': 3 * k }, svg); tx.textContent = r.label; reveal(tx, at + 1, { noMove: true }) }
  })
  st.lands.filter(l => l.label && l.at).forEach(l => { const tx = svgEl('text', { x: l.at[0], y: l.at[1], 'text-anchor': 'middle', 'font-size': 24 * k, 'font-weight': 800, fill: '#3a2a20', 'paint-order': 'stroke', stroke: '#ffffffb0', 'stroke-width': 3 * k }, svg); tx.textContent = l.label; reveal(tx, mark(s, v.landsAt ?? 0) + 0.3, { noMove: true }) })
  st.tags.forEach(tg => { const tx = svgEl('text', { x: tg.x, y: tg.y, 'text-anchor': 'middle', 'font-size': 17 * k, 'font-weight': 700, 'font-style': 'italic', fill: '#7A3B22', 'paint-order': 'stroke', stroke: '#fffdf8', 'stroke-width': 3 * k }, svg); tx.textContent = tg.text; reveal(tx, mark(s, v.tagsAt ?? 0), { noMove: true }) })
  const cg = svgEl('g', {}, svg)
  st.cities.forEach(c => {
    svgEl('circle', { cx: c.x, cy: c.y, r: (c.big ? 5 : 3.6) * k, fill: '#24303F', stroke: '#fff', 'stroke-width': 0.8 * k }, cg)
    const tx = svgEl('text', { x: c.x + (c.side === 'left' ? -7 : c.side === 'below' ? 0 : 7) * k, y: c.y + (c.side === 'below' ? 17 : -6) * k, 'text-anchor': c.side === 'left' ? 'end' : c.side === 'below' ? 'middle' : 'start', 'font-size': (c.big ? 20 : 17) * k, 'font-weight': 700, fill: '#24303F', 'paint-order': 'stroke', stroke: '#fffdf8', 'stroke-width': 3 * k }, cg)
    tx.textContent = c.name
  })
  reveal(cg, mark(s, v.citiesAt ?? 0), { noMove: true })
  const box = $('div', 'graph'); box.append(svg)
  return wrapWithSide(s, v, box)
}

// chain: cause → effect boxes, each appearing on its marker.
function histChain(s, v) {
  const w = $('div', 'hchain')
  v.items.forEach((it, i) => {
    const row = $('div', 'hchain-row')
    if (i) row.append($('div', 'hchain-arrow', '↓'))
    row.append($('div', `hchain-box${i === v.items.length - 1 ? ' last' : ''}`, inl(it.text)))
    w.append(reveal(row, mark(s, it.at)))
  })
  return wrapWithSide(s, v, w)
}

// timeline: a single axis with events appearing on their markers.
function histTimeline(s, v) {
  const [y0, y1] = v.range, W = 1080, x = y => 30 + (y - y0) / (y1 - y0) * (W - 60)
  const svg = svgEl('svg', { viewBox: `0 0 ${W} 380`, width: W, height: 380 })
  svgEl('line', { x1: 20, x2: W - 20, y1: 180, y2: 180, stroke: '#24303F', 'stroke-width': 4 }, svg)
  for (const tk of v.ticks ?? []) { const tx = svgEl('text', { x: x(tk), y: 212, 'text-anchor': 'middle', 'font-size': 15, 'font-family': 'IBM Plex Mono', fill: '#6A6F78' }, svg); tx.textContent = tk < 0 ? `${-tk} BCE` : tk === 0 ? '0' : `${tk} CE`; svgEl('line', { x1: x(tk), x2: x(tk), y1: 172, y2: 188, stroke: '#24303F', 'stroke-width': 2 }, svg) }
  v.events.forEach((e, i) => {
    const up = i % 2 === 0, g = svgEl('g', {}, svg), ex = x(e.year)
    svgEl('line', { x1: ex, x2: ex, y1: 180, y2: up ? 120 - (i % 4 === 0 ? 0 : 40) : 258 + (i % 4 === 1 ? 0 : 40), stroke: e.color ?? '#B5482A', 'stroke-width': 2.5 }, g)
    svgEl('circle', { cx: ex, cy: 180, r: 9, fill: e.color ?? '#B5482A' }, g)
    const ty = up ? 110 - (i % 4 === 0 ? 0 : 40) : 282 + (i % 4 === 1 ? 0 : 40)
    const t1 = svgEl('text', { x: ex, y: ty - 18, 'text-anchor': 'middle', 'font-size': 15, 'font-family': 'IBM Plex Mono', 'font-weight': 600, fill: e.color ?? '#B5482A' }, g); t1.textContent = e.date
    const t2 = svgEl('text', { x: ex, y: ty + 2, 'text-anchor': 'middle', 'font-size': 19, 'font-weight': 800, fill: '#24303F' }, g); t2.textContent = e.label
    reveal(g, mark(s, e.at), { noMove: true })
  })
  return wrapWithSide(s, v, svg)
}

window.render = t => {
  let i = 0
  while (i < D.scenes.length - 1 && t >= D.scenes[i].start + D.scenes[i].dur) i++
  const s = D.scenes[i], lt = t - s.start
  if (i !== cur) { cur = i; build(s) }
  const sig = [i]
  for (const it of items) {
    let p = ease(clamp((lt - it.at) / 0.45))
    if (it.until != null && lt >= it.until) p = Math.min(p, 1 - ease(clamp((lt - it.until) / 0.3)))
    it.el.style.opacity = p
    it.el.style.transform = p < 1 && !it.noMove ? `translateY(${((1 - p) * 16).toFixed(1)}px)` : ''
    sig.push(Math.round(p * 30))
  }
  for (const h of hls) { const on = lt >= h.at && lt < (h.until ?? 1e9); h.el.classList.toggle(h.cls ?? 'hl', on); sig.push(+on) }
  for (const f of flips) { const p = ease(clamp((lt - f.at) / 0.35)); f.a.style.opacity = 1 - p; f.b.style.opacity = p; sig.push(Math.round(p * 20)) }
  for (const vs of versions) {
    if (vs.fade) { const p = ease(clamp((lt - vs.ats[0]) / 0.4)); vs.spans[0].style.opacity = 1 - 0.75 * p; sig.push(Math.round(p * 10)); continue }
    let k = 0
    vs.ats.forEach((a, j) => { if (lt >= a) k = j })
    vs.spans.forEach((sp, j) => { const p = j === k ? (j === 0 ? 1 : ease(clamp((lt - vs.ats[j]) / 0.4))) : 0; sp.style.opacity = p })
    sig.push(k * 100 + Math.round(ease(clamp((lt - vs.ats[k]) / 0.4)) * 20))
  }
  for (const d of draws) { const p = clamp((lt - d.at) / 1.8); d.el.style.strokeDasharray = 1000; d.el.style.strokeDashoffset = (1000 * (1 - ease(p))).toFixed(1); sig.push(Math.round(p * 60)) }
  // caption: current sentence with spoken words dark
  const at = lt - s.lead
  let si = 0
  for (let k = 0; k < sentences.length; k++) if (sentences[k][0].t <= at) si = k
  const sent = sentences[si] ?? []
  const said = sent.filter(w => w.t <= at).length
  const cap = document.getElementById('caption')
  const key = `${i}:${si}:${said}`
  if (cap.dataset.key !== key) {
    cap.dataset.key = key
    cap.innerHTML = '<div>' + sent.map((w, k) => `<span class="w${k < said ? ' said' : ''}">${w.w}</span>`).join(' ') + '</div>'
  }
  sig.push(key)
  if (timer) {
    const startCd = s.lead + s.audio + 0.3, left = Math.max(0, s.countdown - (lt - startCd))
    const frac = clamp(left / s.countdown)
    timer.num.textContent = Math.ceil(Math.min(left, s.countdown))
    timer.ring.setAttribute('stroke-dashoffset', (326.7 * (1 - frac)).toFixed(1))
    sig.push(Math.ceil(left), Math.round(frac * 120))
  }
  const px = Math.round(1280 * t / total)
  document.getElementById('fill').style.width = px + 'px'
  sig.push(px)
  return sig.join(',')
}
</script>
