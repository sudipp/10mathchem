<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../math-self-learning/node_modules/katex/dist/katex.min.css" />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,500;1,600&family=IBM+Plex+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=block" rel="stylesheet" />
<script src="../math-self-learning/node_modules/katex/dist/katex.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1280px;height:720px;overflow:hidden;background:#F2F0E9;font-family:'Plus Jakarta Sans',sans-serif;color:#2E4036;-webkit-font-smoothing:antialiased}
#frame{position:relative;width:1280px;height:720px}
header{position:absolute;left:44px;right:44px;top:26px;display:flex;justify-content:space-between;align-items:center}
.tag{font:600 13px 'IBM Plex Mono',monospace;letter-spacing:.12em;color:#a33d20}
.chapters{display:flex;gap:6px}
.chapters span{font:500 12px 'IBM Plex Mono',monospace;padding:6px 12px;border-radius:20px;color:#8a948b;border:1px solid #d5dacd}
.chapters span.done{color:#2E4036;background:#e5e7db;border-color:#cfd6c6}
.chapters span.on{background:#2E4036;color:#F2F0E9;border-color:#2E4036}
#stage{position:absolute;left:44px;right:44px;top:78px;bottom:150px;display:flex;align-items:center;justify-content:center}
#caption{position:absolute;left:44px;right:44px;bottom:34px;height:96px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:27px;font-weight:600;line-height:1.35;background:#fffdf7;border-radius:28px;padding:10px 40px;border:1px solid #e1e2d9;letter-spacing:-.01em}
.w{color:#b6beb3}.w.said{color:#2E4036}
#bar{position:absolute;left:0;right:0;bottom:0;height:8px;background:#e1e3d9}#fill{height:100%;background:#CC5833}
.katex{font-size:1em}.katex-display{margin:0!important}.fit{transform-origin:center center;display:flex;align-items:center;justify-content:center}.slot{height:124px;display:flex;align-items:center;justify-content:center}.cell.hidden{visibility:hidden}
.reveal{will-change:opacity,transform}
/* title */
.title{text-align:center;display:flex;flex-direction:column;align-items:center;gap:18px}
.title .kicker{font:600 16px 'IBM Plex Mono',monospace;letter-spacing:.16em;color:#a33d20}
.title h1{font-size:96px;font-weight:700;letter-spacing:-.05em;line-height:1}
.title h1 em{display:block;font-family:'Cormorant Garamond',serif;font-weight:500;font-size:112px;letter-spacing:-.03em}
.title .sub{font-size:26px;color:#536157}
.curve{position:absolute;inset:auto 0 -10px 0;opacity:.18}
/* lines */
.lines{display:flex;flex-direction:column;align-items:center;gap:22px;font-size:46px}
.lines h2{font-size:30px;font-weight:700;letter-spacing:-.03em;margin-bottom:8px}
.lines .line{display:flex;align-items:center;gap:18px;padding:6px 18px;border-radius:20px}
.lines .line.big{font-size:56px}
.lines .line.box{background:#fffdf7;border:2px solid #2E4036;font-size:36px;padding:18px 28px}
.lines .line.glow{background:#2E4036;color:#F2F0E9}
/* moves */
.moves{display:flex;flex-direction:column;align-items:center;gap:26px}
.cards{display:flex;gap:18px}
.card{width:240px;height:250px;background:#fffdf7;border:1px solid #e1e2d9;border-radius:30px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;position:relative}
.card .n{width:58px;height:58px;border-radius:50%;background:#2E4036;color:#F2F0E9;display:flex;align-items:center;justify-content:center;font:700 24px 'IBM Plex Mono',monospace}
.card .name{font-size:32px;font-weight:800;letter-spacing:-.03em}
.card .name b{color:#CC5833}
.card .d{font-size:17px;color:#6b756d;text-align:center;padding:0 18px;line-height:1.4}
.card .mn{position:absolute;bottom:-20px;background:#CC5833;color:#fff;font-weight:700;font-size:20px;padding:6px 16px;border-radius:20px}
.repeat{font:600 18px 'IBM Plex Mono',monospace;color:#a33d20;letter-spacing:.08em}
/* long division */
.ld-wrap{display:flex;gap:40px;align-items:center;width:100%;justify-content:center}
.ld-main{display:flex;flex-direction:column;align-items:center;gap:16px}
.problem{font-size:30px;background:#fffdf7;border:1px solid #e1e2d9;border-radius:20px;padding:10px 24px}
.ld{display:grid;align-items:center;font-size:34px}
.cell{position:relative;padding:3px 14px;text-align:right;white-space:nowrap;border-radius:12px;min-height:46px;display:flex;align-items:center;justify-content:flex-end}
.cell.divisor{border-right:3px solid #2E4036;border-bottom-right-radius:20px;padding-right:16px;margin-right:4px}
.cell.top{border-top:3px solid #2E4036;border-radius:0}
.cell.ph{color:#9aa69c}
.cell.q{color:#a33d20;font-weight:600}
.cell.prod{color:#5d6d61;border-bottom:2.5px solid #879783;border-radius:0}
.cell .b{position:absolute;right:14px}.cell.prod .b{color:#CC5833}.cell.divisor .b{right:16px}
.cell.after.brought{color:#2E4036}
.cell.hl{background:#f6d8ca;box-shadow:0 0 0 3px #CC5833 inset}
.cell.prod.hl{border-radius:12px}
.note{font-size:34px;background:#2E4036;color:#F2F0E9;border-radius:22px;padding:12px 26px;min-height:64px}
.answer{display:flex;align-items:center;gap:14px;font-size:40px;background:#2E4036;color:#F2F0E9;border-radius:26px;padding:16px 32px}
.answer .lbl{font:600 14px 'IBM Plex Mono',monospace;letter-spacing:.14em;color:#edb096}
.cheer{font-size:30px;font-weight:800;color:#CC5833}
.tracker{display:flex;flex-direction:column;gap:12px}
.tracker div{display:flex;align-items:center;gap:14px;font-size:22px;font-weight:700;padding:12px 22px;border-radius:20px;background:#fffdf7;border:1px solid #e1e2d9;color:#9aa69c;width:250px}
.tracker div span{font:600 16px 'IBM Plex Mono',monospace}
.tracker div.on{background:#CC5833;border-color:#CC5833;color:#fff}
/* try */
.try{display:flex;flex-direction:column;align-items:center;gap:26px;text-align:center}
.try .big{font-size:64px;font-weight:800;letter-spacing:-.04em}
.try .big em{font-family:'Cormorant Garamond',serif;font-weight:500;color:#CC5833}
.try .prob{font-size:50px;background:#fffdf7;border:2px solid #2E4036;border-radius:28px;padding:20px 36px}
.try .hint{display:flex;gap:10px}
.try .hint span{font:600 15px 'IBM Plex Mono',monospace;padding:8px 14px;border-radius:16px;background:#e5e7db}
.timer{position:relative;width:120px;height:120px}
.timer svg{width:120px;height:120px;transform:rotate(-90deg)}
.timer .num{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font:700 42px 'IBM Plex Mono',monospace}
.timer small{display:block}
.pause{font-size:18px;color:#6b756d}
/* recap */
.recap{display:flex;flex-direction:column;gap:16px;width:900px}
.recap h2{font-size:44px;font-weight:800;letter-spacing:-.04em;margin-bottom:6px}
.recap h2 em{font-family:'Cormorant Garamond',serif;font-weight:500;color:#CC5833}
.item{display:flex;align-items:center;gap:18px;background:#fffdf7;border:1px solid #e1e2d9;border-radius:22px;padding:16px 24px;font-size:26px;font-weight:600}
.item .ck{flex-shrink:0;width:40px;height:40px;border-radius:50%;background:#CC5833;color:#fff;display:flex;align-items:center;justify-content:center;font-size:22px}
.item .katex{font-size:1.15em}
/* synthetic division */
.syn{display:grid;align-items:center;font-size:38px}
.syn .cell{justify-content:center;padding:6px 18px;min-height:58px}
.cell.k{border:3px solid #2E4036;border-radius:14px;margin-right:18px;font-weight:600}
.cell.sprod{color:#CC5833}
.cell.res{border-top:3px solid #2E4036;border-radius:0;font-weight:700}
.cell.res.rem{box-shadow:0 0 0 3px #CC5833 inset;border-radius:14px;background:#fbe3d8}
/* graph */
.graph-wrap{display:flex;gap:36px;align-items:center}
.graph svg{display:block;background:#fffdf7;border-radius:24px;border:1px solid #e1e2d9}
.gg{stroke:#e6e8df;stroke-width:1}.ga{stroke:#2E4036;stroke-width:2}
.gt{font:500 13px 'IBM Plex Mono',monospace;fill:#7b867d;text-anchor:middle}.gty{text-anchor:end}
.gcurve{fill:none;stroke:#2E4036;stroke-width:4;stroke-linejoin:round;stroke-linecap:round}.gcurve2{stroke:#CC5833}.gdiag{stroke:#8a948c;stroke-width:2.5;stroke-dasharray:8 7}
.gz{fill:#CC5833}.gd{fill:#fffdf7;stroke:#2E4036;stroke-width:3.5}.gh{fill:#CC583330;stroke:#CC5833;stroke-width:3.5}
.gl{font:700 17px 'Plus Jakarta Sans',sans-serif;fill:#a33d20;text-anchor:middle;paint-order:stroke;stroke:#fffdf7;stroke-width:5px}
.graph-side{display:flex;flex-direction:column;gap:14px;max-width:440px;font-size:30px}
.gs{font-size:28px;background:#fffdf7;border:1px solid #e1e2d9;border-radius:18px;padding:10px 20px;font-weight:600}
.gs.strong{background:#2E4036;color:#F2F0E9;border-color:#2E4036}
/* sort */
.sf{display:flex;flex-direction:column;align-items:center;gap:26px}
.sf-rule{font:600 18px 'IBM Plex Mono',monospace;color:#a33d20;letter-spacing:.06em}
.sf-row{display:flex;gap:18px}
.sf-chip{display:flex;flex-direction:column;align-items:center;gap:6px;background:#fffdf7;border:1px solid #e1e2d9;border-radius:22px;padding:16px 24px;font-size:40px;min-width:130px}
.sf-deg{font:600 14px 'IBM Plex Mono',monospace;color:#a33d20}
.sf-slot{width:150px;height:96px;border:3px dashed #b9c4b0;border-radius:22px;display:flex;align-items:center;justify-content:center;font-size:40px}
.sf-in{display:flex;align-items:center;justify-content:center;width:100%;height:100%;border-radius:19px;background:#fffdf7;outline:3px solid #2E4036}
.sf-result{font-size:30px;background:#2E4036;color:#F2F0E9;border-radius:20px;padding:12px 26px}
/* table */
.table{display:flex;flex-direction:column;align-items:center;gap:16px}
.table h2{font-size:34px;font-weight:800;letter-spacing:-.03em}
.tgrid{display:grid;grid-template-columns:auto auto;gap:10px 14px}
.tl,.tr{background:#fffdf7;border:1px solid #e1e2d9;border-radius:16px;padding:10px 22px;font-size:26px;font-weight:600}
.tl{text-align:center;font-family:'IBM Plex Mono',monospace;color:#a33d20;min-width:120px}
.tr{min-width:360px}
.texample{font-size:28px;background:#2E4036;color:#F2F0E9;border-radius:18px;padding:12px 24px}
/* cards */
.cards-title{font-size:34px;font-weight:800;letter-spacing:-.03em}
.card.wide{width:auto;min-width:300px;height:auto;padding:26px 30px;gap:14px}
.card.dark{background:#2E4036;color:#F2F0E9;border-color:#2E4036}.card.dark .d{color:#c9d4c3}
.ctex{font-size:34px}
.chips{display:flex;gap:12px}.chips span{font-size:22px;font-weight:700;background:#CC5833;color:#fff;border-radius:18px;padding:8px 18px}
/* function machine */
.machine-wrap{display:flex;flex-direction:column;align-items:center;gap:30px}
.machine{display:flex;align-items:center;gap:12px}
.mbox{display:grid;place-items:center;min-width:110px;min-height:84px;padding:14px 22px;border-radius:22px;background:#fffdf7;border:1px solid #d5dacd;font-size:30px}
.mbox .mv{grid-area:1/1;white-space:nowrap}
.mbox.fn{background:#2E4036;color:#F2F0E9;border-color:#2E4036}
.mbox.hl{outline:4px solid #CC5833;outline-offset:3px}
.marrow{font-size:34px;color:#879783}
.mline{font-size:38px}
</style>
</head>
<body>
<div id="frame">
  <header><div class="tag" id="tag"></div><div class="chapters" id="chapters"></div></header>
  <div id="stage"></div>
  <div id="caption"></div>
  <div id="bar"><div id="fill"></div></div>
</div>
<script>
const MOVES = [['Divide', 'first term ÷ first term'], ['Multiply', 'answer × divisor'], ['Subtract', 'change signs, then add'], ['Bring down', 'the next term']]
const MNEMONIC = ['Dad', 'Mom', 'Sister', 'Brother']
const SYN_STEPS = ['Bring down', 'Multiply', 'Add']
let D, total, cur = -1, items = [], hls = [], flips = [], versions = [], draws = [], sentences = [], timer = null, chapterEls = []
const $ = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e }
const tex = (s, display = false) => katex.renderToString((display ? '\\displaystyle ' : '') + s, { throwOnError: false })
const clamp = x => Math.max(0, Math.min(1, x))
const ease = x => 1 - Math.pow(1 - x, 3)

window.setup = data => {
  D = data
  total = D.scenes.reduce((a, s) => a + s.dur, 0)
  document.getElementById('tag').textContent = D.tag
  const ch = document.getElementById('chapters')
  chapterEls = D.chapters.map(c => { const e = $('span', '', c); ch.appendChild(e); return e })
  // cumulative reveals per layout: which keys were revealed before each scene
  const seen = {}
  D.scenes.forEach(s => {
    const v = s.view
    if (!['longdiv', 'synth', 'graph'].includes(v.kind)) return
    seen[v.layout] ??= new Set()
    s.prevKeys = [...seen[v.layout]]
    ;(v.reveal ?? []).forEach(([k]) => seen[v.layout].add(k))
  })
  return total
}

function mark(s, m) { return m == null || m === 0 ? 0 : m < 0 ? m : s.marks[m] ?? 0 }
function reveal(el, at, opts = {}) { el.classList.add('reveal'); items.push({ el, at, ...opts }); return el }

function build(s) {
  const outer = document.getElementById('stage')
  outer.innerHTML = ''
  const stage = $('div', 'fit')
  outer.append(stage)
  items = []; hls = []; flips = []; versions = []; draws = []; timer = null
  const v = s.view
  if (v.kind === 'title') {
    const w = $('div', 'title')
    w.append($('div', 'kicker', v.kicker), $('h1', '', `${v.title}<em>${v.em}</em>`), $('div', 'sub', v.sub))
    reveal(w, 0)
    stage.append(w)
  } else if (v.kind === 'lines') {
    const w = $('div', 'lines')
    if (v.title) w.append(reveal($('h2', '', v.title), 0))
    for (const l of v.lines) {
      const row = $('div', `line${l.big ? ' big' : ''}${l.box ? ' box' : ''}${l.glow ? ' glow' : ''}`)
      if (l.parts) l.parts.forEach(p => row.append(reveal($('span', '', tex(p.tex, true)), mark(s, p.at))))
      else { row.innerHTML = tex(l.tex, true); reveal(row, mark(s, l.at)) }
      w.append(row)
    }
    stage.append(w)
  } else if (v.kind === 'moves') {
    const w = $('div', 'moves'), cards = $('div', 'cards')
    MOVES.forEach(([name, d], i) => {
      const c = $('div', 'card')
      c.append($('div', 'n', i + 1), $('div', 'name', name), $('div', 'd', d))
      if (v.mnemonicAt) c.append(reveal($('div', 'mn', MNEMONIC[i]), mark(s, v.mnemonicAt) + i * 0.32))
      cards.append(v.at ? reveal(c, mark(s, v.at[i])) : c)
    })
    w.append(cards)
    if (v.repeatAt) w.append(reveal($('div', 'repeat', '↻  REPEAT UNTIL YOU CAN’T DIVIDE'), mark(s, v.repeatAt)))
    stage.append(w)
  } else if (v.kind === 'longdiv' || v.kind === 'synth') {
    const L = D.layouts[v.layout]
    const wrap = $('div', 'ld-wrap'), main = $('div', 'ld-main')
    main.append($('div', 'problem', tex(L.problem)))
    const grid = $('div', v.kind === 'synth' ? 'syn' : 'ld')
    grid.style.gridTemplateColumns = `auto repeat(${L.cols - 1}, auto)`
    const prev = new Set(s.prevKeys), now = Object.fromEntries((v.reveal ?? []).map(([k, m]) => [k, mark(s, m)]))
    for (const c of L.cells) {
      const shownAt = prev.has(c.key) ? -9 : c.key in now ? now[c.key] : null
      const el = $('div', `cell ${c.cls}`, `<span class="a">${tex(c.tex)}</span>`)
      el.style.gridRow = c.row; el.style.gridColumn = c.col
      grid.append(el)
      if (shownAt == null || (v.problemOnly && !('setup' in now))) { el.classList.add('hidden'); continue }
      reveal(el, shownAt)
      if (c.tex2) {
        const flipAt = prev.has(c.key2) ? -9 : c.key2 in now ? now[c.key2] : null
        if (flipAt != null) { const b = $('span', 'b', tex(c.tex2)); el.append(b); flips.push({ a: el.querySelector('.a'), b, at: flipAt }) }
      }
      for (const [id, m] of v.hl ?? []) {
        if (id === c.id) hls.push({ el, at: mark(s, m) })
        if (id === 'divLead' && c.id === 'div') { const b = $('span', 'b', tex(c.texLead)); el.append(b); flips.push({ a: el.querySelector('.a'), b, at: mark(s, m) }) }
      }
    }
    main.append(grid)
    const slot = $('div', 'slot')
    if (v.note) slot.append(reveal($('div', 'note', tex(v.note.tex)), mark(s, v.note.at)))
    if (v.answer) {
      const a = $('div', 'answer'); a.append($('span', 'lbl', 'ANSWER'))
      v.answer.forEach(p => a.append(reveal($('span', '', tex(p.tex)), mark(s, p.at))))
      slot.append(reveal(a, mark(s, v.answer[0].at) - 0.05))
    }
    main.append(slot)
    wrap.append(main)
    const steps = v.kind === 'synth' ? SYN_STEPS : MOVES.map(m => m[0])
    const tr = $('div', 'tracker')
    const trEls = steps.map((name, i) => { const d = $('div', i === s.move ? 'on' : '', `<span>${i + 1}</span>${name}`); tr.append(d); return d })
    ;(v.track ?? []).forEach(([idx, m], j) => { const nxt = v.track[j + 1]; hls.push({ el: trEls[idx], at: mark(s, m), until: nxt ? mark(s, nxt[1]) : 1e9, cls: 'on' }) })
    wrap.append(tr)
    stage.append(wrap)
  } else if (v.kind === 'graph') {
    const L = D.layouts[v.layout], [x0, x1, y0, y1] = L.win
    const W = 520, H = 400, pad = 26
    const sx = x => pad + (x - x0) / (x1 - x0) * (W - 2 * pad), sy = y => H - pad - (y - y0) / (y1 - y0) * (H - 2 * pad)
    const step = v => { const r = v / 8; return r <= 0.25 ? 0.25 : r <= 0.5 ? 0.5 : r <= 1 ? 1 : r <= 2 ? 2 : 4 }
    const gx = step(x1 - x0), gy = step(y1 - y0)
    let grid = ''
    for (let x = Math.ceil(x0 / gx) * gx; x <= x1 + 1e-9; x += gx) grid += `<line x1="${sx(x)}" x2="${sx(x)}" y1="${pad}" y2="${H - pad}" class="gg"/>${Math.abs(x) > 1e-9 && Math.abs(Math.round(x / gx)) % 2 === 0 ? `<text x="${sx(x)}" y="${sy(0) + 18}" class="gt">${+x.toFixed(2)}</text>` : ''}`
    for (let y = Math.ceil(y0 / gy) * gy; y <= y1 + 1e-9; y += gy) grid += `<line y1="${sy(y)}" y2="${sy(y)}" x1="${pad}" x2="${W - pad}" class="gg"/>${Math.abs(y) > 1e-9 && Math.abs(Math.round(y / gy)) % 2 === 0 ? `<text x="${sx(0) - 7}" y="${sy(y) + 5}" class="gt gty">${+y.toFixed(2)}</text>` : ''}`
    const path = 'M' + L.pts.map(([x, y]) => `${sx(x).toFixed(1)},${sy(y).toFixed(1)}`).join('L')
    const svg = $('div', 'graph', `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}"><defs><clipPath id="gc"><rect x="${pad}" y="${pad}" width="${W - 2 * pad}" height="${H - 2 * pad}"/></clipPath></defs>${grid}<line x1="${pad}" x2="${W - pad}" y1="${sy(0)}" y2="${sy(0)}" class="ga"/><line y1="${pad}" y2="${H - pad}" x1="${sx(0)}" x2="${sx(0)}" class="ga"/><path d="${path}" class="gcurve" clip-path="url(#gc)" pathLength="1000"/></svg>`)
    const svgEl = svg.querySelector('svg'), ns = 'http://www.w3.org/2000/svg'
    const add = (tag, attrs) => { const e = document.createElementNS(ns, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); svgEl.append(e); return e }
    const prev = new Set(s.prevKeys), now = Object.fromEntries((v.reveal ?? []).map(([k, m]) => [k, mark(s, m)]))
    const when = k => prev.has(k) ? -9 : k in now ? now[k] : null
    const curveAt = when('curve')
    if (curveAt == null) svgEl.querySelector('.gcurve').style.display = 'none'
    else draws.push({ el: svgEl.querySelector('.gcurve'), at: curveAt })
    for (const z of L.zeros) { const at = when(`zero${z}`) ?? when('zeros'); if (at != null) reveal(add('circle', { cx: sx(z), cy: sy(0), r: 7, class: 'gz' }), at) }
    for (const [x, m] of v.hl ?? []) reveal(add('circle', { cx: sx(x), cy: sy(0), r: 17, class: 'gh' }), mark(s, m))
    if (L.diag) { const at = when('diag'); const e = add('line', { x1: sx(Math.max(x0, y0)), y1: sy(Math.max(x0, y0)), x2: sx(Math.min(x1, y1)), y2: sy(Math.min(x1, y1)), class: 'gdiag', 'clip-path': 'url(#gc)' }); if (at == null) e.style.display = 'none'; else reveal(e, at) }
    for (const c of L.curves ?? []) { const at = when(c.key); const e = add('path', { d: c.segs.map(sg => 'M' + sg.map(([x, y]) => `${sx(x).toFixed(1)},${sy(y).toFixed(1)}`).join('L')).join(''), class: 'gcurve gcurve2', 'clip-path': 'url(#gc)', pathLength: 1000 }); if (at == null) e.style.display = 'none'; else draws.push({ el: e, at }) }
    for (const d of v.dots ?? []) reveal(add('circle', { cx: sx(d.x), cy: sy(d.y), r: 7, class: 'gd' }), mark(s, d.at))
    for (const lb of v.labels ?? []) { const e = add('text', { x: sx(lb.x), y: sy(lb.y), class: 'gl' }); e.textContent = lb.text; reveal(e, mark(s, lb.at)) }
    const side = $('div', 'graph-side')
    side.append($('div', 'problem', tex(v.title ?? `y = ${L.tex}`)))
    for (const l of v.side ?? []) side.append(reveal($('div', `gs${l.strong ? ' strong' : ''}`, l.tex ? tex(l.tex) : l.text), mark(s, l.at)))
    const wrap = $('div', 'graph-wrap'); wrap.append(svg, side)
    stage.append(wrap)
  } else if (v.kind === 'sort') {
    const w = $('div', 'sf')
    if (v.ruleAt != null) w.append(reveal($('div', 'sf-rule', 'Highest degree first ↓'), mark(s, v.ruleAt)))
    const row = $('div', 'sf-row')
    const chips = v.terms.map(t => { const c = $('div', 'sf-chip', `${tex(t.tex)}<span class="sf-deg">degree ${t.deg}</span>`); row.append(c); return c })
    const target = $('div', 'sf-row')
    v.order.forEach((idx, slot) => {
      const sl = $('div', 'sf-slot')
      target.append(sl)
      const m = v.fill?.[slot]
      if (m == null) return
      const inner = $('div', 'sf-in', tex(v.terms[idx].tex))
      sl.append(inner)
      const at = m === -9 ? -9 : mark(s, m)
      reveal(inner, at)
      versions.push({ spans: [chips[idx]], ats: [at], fade: true })
    })
    w.append(row, target)
    if (v.result) w.append(reveal($('div', 'sf-result', tex(v.result.tex)), mark(s, v.result.at)))
    stage.append(w)
  } else if (v.kind === 'table') {
    const w = $('div', 'table')
    if (v.title) w.append($('h2', '', v.title))
    const g = $('div', 'tgrid')
    v.rows.forEach(r => {
      const a = $('div', 'tl', r.tex ? tex(r.left) : r.left), b = $('div', 'tr', r.right)
      g.append(reveal(a, mark(s, r.at)), reveal(b, mark(s, r.at) + 0.1))
    })
    w.append(g)
    if (v.example) w.append(reveal($('div', 'texample', tex(v.example.tex)), mark(s, v.example.at)))
    stage.append(w)
  } else if (v.kind === 'cards') {
    const w = $('div', 'moves')
    if (v.title) w.append($('h2', 'cards-title', v.title))
    const cards = $('div', 'cards')
    v.cards.forEach(c => {
      const el = $('div', `card wide${c.dark ? ' dark' : ''}`)
      if (c.head) el.append($('div', 'name', c.head))
      if (c.tex) el.append($('div', 'ctex', tex(c.tex, true)))
      if (c.text) el.append($('div', 'd', c.text))
      cards.append(reveal(el, mark(s, c.at)))
    })
    w.append(cards)
    if (v.chips) { const ch = $('div', 'chips'); v.chips.items.forEach((t, i) => ch.append(reveal($('span', '', t), mark(s, v.chips.at) + i * 0.3))); w.append(ch) }
    stage.append(w)
  } else if (v.kind === 'machine') {
    const w = $('div', 'machine')
    v.stages.forEach((st, i) => {
      const box = $('div', `mbox${st.fn ? ' fn' : ''}`)
      const spans = st.texs.map(t => { const sp = $('span', 'mv', tex(t)); box.append(sp); return sp })
      versions.push({ spans, ats: st.ats.map(m => m === 0 ? 0 : mark(s, m)) })
      for (const [a, b] of st.on ?? []) hls.push({ el: box, at: mark(s, a), until: b != null ? mark(s, b) : 1e9 })
      w.append(reveal(box, st.at ? mark(s, st.at) : 0))
      if (i < v.stages.length - 1) w.append(reveal($('span', 'marrow', '→'), st.at ? mark(s, st.at) : 0))
    })
    const out = $('div', 'machine-wrap'); out.append(w)
    for (const l of v.lines ?? []) out.append(reveal($('div', 'mline', tex(l.tex, true)), mark(s, l.at)))
    stage.append(out)
  } else if (v.kind === 'try') {
    const w = $('div', 'try')
    w.append($('div', 'big', 'Your <em>turn.</em>'), $('div', 'prob', tex(v.tex)))
    const hint = $('div', 'hint'); (v.hint ?? MOVES.map(m => m[0])).forEach(n => hint.append($('span', '', n))); w.append(hint)
    const t = $('div', 'timer', `<svg viewBox="0 0 120 120"><circle cx="60" cy="60" r="52" fill="none" stroke="#e1e3d9" stroke-width="10"/><circle class="ring" cx="60" cy="60" r="52" fill="none" stroke="#CC5833" stroke-width="10" stroke-linecap="round" stroke-dasharray="326.7" stroke-dashoffset="0"/></svg><div class="num"></div>`)
    timer = { el: t, ring: t.querySelector('.ring'), num: t.querySelector('.num') }
    w.append(t, $('div', 'pause', 'Need more time? Pause the video.'))
    reveal(w, 0)
    stage.append(w)
  } else if (v.kind === 'recap') {
    const w = $('div', 'recap')
    w.append($('h2', '', 'Quick <em>recap.</em>'))
    v.items.forEach(it => {
      const row = $('div', 'item', `<span class="ck">✓</span><span>${it.tex ? tex(it.tex) : it.text}</span>`)
      w.append(reveal(row, mark(s, it.at)))
    })
    stage.append(w)
  }
  // shrink the scene to fit the stage if needed
  const sw = outer.clientWidth, sh = outer.clientHeight
  const scale = Math.min(1, sw / stage.scrollWidth, sh / stage.scrollHeight)
  stage.style.transform = scale < 1 ? `scale(${scale.toFixed(3)})` : ''
  // caption sentences
  sentences = []
  let curS = []
  s.words.forEach(w => { curS.push(w); if (/[.!?:]$/.test(w.w)) { sentences.push(curS); curS = [] } })
  if (curS.length) sentences.push(curS)
  chapterEls.forEach((e, i) => { e.className = i < s.ch ? 'done' : i === s.ch ? 'on' : '' })
}

window.render = t => {
  let i = 0
  while (i < D.scenes.length - 1 && t >= D.scenes[i].start + D.scenes[i].dur) i++
  const s = D.scenes[i], lt = t - s.start
  if (i !== cur) { cur = i; build(s) }
  const sig = [i]
  for (const it of items) {
    const p = ease(clamp((lt - it.at) / 0.45))
    it.el.style.opacity = p
    it.el.style.transform = p < 1 ? `translateY(${((1 - p) * 16).toFixed(1)}px)` : ''
    sig.push(Math.round(p * 30))
  }
  for (const h of hls) { const on = lt >= h.at && lt < (h.until ?? 1e9); h.el.classList.toggle(h.cls ?? 'hl', on); sig.push(+on) }
  for (const f of flips) { const p = ease(clamp((lt - f.at) / 0.35)); f.a.style.opacity = 1 - p; f.b.style.opacity = p; sig.push(Math.round(p * 20)) }
  for (const vs of versions) {
    if (vs.fade) { const p = ease(clamp((lt - vs.ats[0]) / 0.4)); vs.spans[0].style.opacity = 1 - 0.75 * p; sig.push(Math.round(p * 10)); continue }
    let k = 0
    vs.ats.forEach((a, j) => { if (lt >= a) k = j })
    vs.spans.forEach((sp, j) => { const p = j === k ? (j === 0 ? 1 : ease(clamp((lt - vs.ats[j]) / 0.4))) : 0; sp.style.opacity = p })
    sig.push(k * 100 + Math.round(ease(clamp((lt - vs.ats[k]) / 0.4)) * 20))
  }
  for (const d of draws) { const p = clamp((lt - d.at) / 1.8); d.el.style.strokeDasharray = 1000; d.el.style.strokeDashoffset = (1000 * (1 - ease(p))).toFixed(1); sig.push(Math.round(p * 60)) }
  // caption: current sentence with spoken words dark
  const at = lt - s.lead
  let si = 0
  for (let k = 0; k < sentences.length; k++) if (sentences[k][0].t <= at) si = k
  const sent = sentences[si] ?? []
  const said = sent.filter(w => w.t <= at).length
  const cap = document.getElementById('caption')
  const key = `${i}:${si}:${said}`
  if (cap.dataset.key !== key) {
    cap.dataset.key = key
    cap.innerHTML = '<div>' + sent.map((w, k) => `<span class="w${k < said ? ' said' : ''}">${w.w}</span>`).join(' ') + '</div>'
  }
  sig.push(key)
  if (timer) {
    const startCd = s.lead + s.audio + 0.3, left = Math.max(0, s.countdown - (lt - startCd))
    const frac = clamp(left / s.countdown)
    timer.num.textContent = Math.ceil(Math.min(left, s.countdown))
    timer.ring.setAttribute('stroke-dashoffset', (326.7 * (1 - frac)).toFixed(1))
    sig.push(Math.ceil(left), Math.round(frac * 120))
  }
  const px = Math.round(1280 * t / total)
  document.getElementById('fill').style.width = px + 'px'
  sig.push(px)
  return sig.join(',')
}
</script>
